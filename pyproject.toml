[build-system]
requires = ["setuptools >= 69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "csds-353-vault"
version = "0.0.1"
description = "Data Science and Machine Learning Vault"
authors = [{name = "Jala R&D", email = "RD_GenerativeAI@jalasoft.com"}]
license = {file = "LICENSE"}
requires-python = ">=3.12"

dependencies = [
  "ipykernel==7.1.0",
  "ipympl==0.9.8",
  "matplotlib==3.10.8",
  "numpy==2.3.5",
  "pandas==2.3.3",
  "rich==14.2.0",
  "torch==2.9.1",
  "torchtext==0.18.0",
  "torchvision==0.24.1",
  "seaborn==0.13.2",
  "sentence-transformers==5.2.0",
  "fastapi==0.124.4",
  "uvicorn==0.38.0",
  "python-multipart==0.0.20",
  "pymupdf==1.26.7",
  "pydantic==2.12.5",
  "pydantic-settings==2.12.0",
  "langchain_chroma==0.2.6",
  "langchain_core==0.3.78",
  "langchain_text_splitters==0.3.11",
  "google-genai==1.55.0",
  "ultralytics==8.3.237",
  "httpx>=0.28.1",
  "mcp[cli]>=1.23.1",
  "httpx>=0.28.1",
  "google-generativeai>=0.8.5",
  "python-dotenv>=1.2.1",
  "anthropic==0.75.0",
  "streamlit==1.52.1"
]

[project.scripts]
csds-353-vault = "app.main:main"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
exclude = [
  "mcp-demo/",
  "src/app/mcp",
]
